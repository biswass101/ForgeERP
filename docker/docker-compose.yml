services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: forgeerp-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: forgeerp
      POSTGRES_PASSWORD: forgeerp_password
      POSTGRES_DB: forgeerp

    ports:
      - "5432:5432"

    volumes:
      - forgeerp_postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: forgeerp-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin123

    ports:
      - "5050:80"

    depends_on:
      - postgres

    volumes:
      - forgeerp_pgadmin_data:/var/lib/pgadmin

volumes:
  forgeerp_postgres_data:
  forgeerp_pgadmin_data: